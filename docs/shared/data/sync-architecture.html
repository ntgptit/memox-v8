<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MemoX offline-first sync</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f9fe;   /* surface */
      --color-ink:     #0f1638;   /* on-surface */
      --color-muted:   #4a5278;   /* on-surface-variant */
      --color-accent:  #4151c6;   /* indigo ink */
      --font-sans:     'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · MemoX V8</p>
    <h1>MemoX offline-first sync</h1>

    <div class="diagram-container">
      <svg viewBox="0 48 960 552" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-architecture-title sync-architecture-desc">
        <title id="sync-architecture-title">MemoX offline-first sync</title>
        <desc id="sync-architecture-desc">Every change is written to Drift on the device, a trigger queues it in sync_outbox, and SyncCoordinator pushes the outbox and pulls changes through the Supabase RPCs sync_push and sync_changes.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5278"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4151c6"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6c59c6"/></marker>
        </defs>

        <rect y="48" width="960" height="552" fill="#f7f9fe"/>

        <!-- Zones (before arrows and nodes) -->
        <rect x="24" y="72" width="656" height="432" rx="8"
              fill="rgba(15,22,56,0.02)" stroke="rgba(15,22,56,0.10)" stroke-width="0.8"/>
        <rect x="40" y="76" width="120" height="12" rx="2" fill="#f7f9fe"/>
        <text x="100" y="85" fill="rgba(15,22,56,0.45)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">DEVICE · OFFLINE-FIRST</text>

        <rect x="712" y="232" width="224" height="272" rx="8"
              fill="rgba(15,22,56,0.02)" stroke="rgba(15,22,56,0.10)" stroke-width="0.8"/>
        <rect x="728" y="236" width="64" height="12" rx="2" fill="#f7f9fe"/>
        <text x="760" y="245" fill="rgba(15,22,56,0.45)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SUPABASE</text>

        <!-- Arrows (behind boxes) -->
        <!-- Screens → Repository -->
        <line x1="200" y1="136" x2="264" y2="136" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Repository → Drift tables -->
        <line x1="416" y1="136" x2="480" y2="136" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Drift tables → sync_outbox (capture triggers) -->
        <line x1="568" y1="168" x2="568" y2="264" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- sync_outbox → SyncCoordinator (push reads one batch) -->
        <line x1="480" y1="296" x2="416" y2="296" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- SyncScheduler → SyncCoordinator -->
        <line x1="200" y1="296" x2="264" y2="296" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- SyncCoordinator → Repository · DAO (pull applies through the sync adapters) -->
        <line x1="340" y1="264" x2="340" y2="168" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- SyncCoordinator → SupabaseSyncApi -->
        <line x1="340" y1="328" x2="340" y2="424" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- SupabaseSyncApi → RPC (network) -->
        <line x1="416" y1="456" x2="736" y2="456" stroke="#6c59c6" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- RPC → Postgres -->
        <line x1="824" y1="424" x2="824" y2="328" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- sync_outbox ⇢ SyncScheduler (watch, dashed; hops the vertical Coordinator → Api line at x=340) -->
        <path d="M 568,328 V 352 Q 568,360 560,360 H 348 a 8,8 0 0,0 -16,0 H 136 Q 128,360 128,352 V 328"
              fill="none" stroke="#4a5278" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque masks, 8px from their stroke) -->
        <rect x="214" y="116" width="36" height="12" rx="2" fill="#f7f9fe"/>
        <text x="232" y="125" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE</text>

        <rect x="436" y="116" width="24" height="12" rx="2" fill="#f7f9fe"/>
        <text x="448" y="125" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>

        <rect x="576" y="210" width="48" height="12" rx="2" fill="#f7f9fe"/>
        <text x="600" y="219" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TRIGGER</text>

        <rect x="430" y="276" width="36" height="12" rx="2" fill="#f7f9fe"/>
        <text x="448" y="285" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BATCH</text>

        <rect x="220" y="276" width="24" height="12" rx="2" fill="#f7f9fe"/>
        <text x="232" y="285" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>

        <rect x="348" y="210" width="36" height="12" rx="2" fill="#f7f9fe"/>
        <text x="366" y="219" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY</text>

        <rect x="264" y="384" width="68" height="12" rx="2" fill="#f7f9fe"/>
        <text x="298" y="393" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUSH · PULL</text>

        <rect x="542" y="436" width="68" height="12" rx="2" fill="#f7f9fe"/>
        <text x="576" y="445" fill="#6c59c6" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RPC · HTTPS</text>

        <rect x="442" y="368" width="36" height="12" rx="2" fill="#f7f9fe"/>
        <text x="460" y="377" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WATCH</text>

        <!-- Node: Screens (input) -->
        <rect x="48" y="104" width="152" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="48" y="104" width="152" height="64" rx="6" fill="rgba(74,82,120,0.10)" stroke="#7c85ab" stroke-width="1"/>
        <rect x="56" y="112" width="20" height="12" rx="2" fill="transparent" stroke="rgba(124,133,171,0.40)" stroke-width="0.8"/>
        <text x="66" y="121" fill="#7c85ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="124" y="140" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Screens</text>
        <text x="124" y="156" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">widget + controller</text>

        <!-- Node: Repository · DAO (backend) -->
        <rect x="264" y="104" width="152" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="264" y="104" width="152" height="64" rx="6" fill="#ffffff" stroke="#0f1638" stroke-width="1"/>
        <rect x="272" y="112" width="28" height="12" rx="2" fill="transparent" stroke="rgba(15,22,56,0.40)" stroke-width="0.8"/>
        <text x="286" y="121" fill="#0f1638" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="340" y="140" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Repository · DAO</text>
        <text x="340" y="156" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ 7 sync adapter</text>

        <!-- Node: Drift tables (store) -->
        <rect x="480" y="104" width="176" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="480" y="104" width="176" height="64" rx="6" fill="rgba(15,22,56,0.05)" stroke="#4a5278" stroke-width="1"/>
        <rect x="488" y="112" width="20" height="12" rx="2" fill="transparent" stroke="rgba(74,82,120,0.50)" stroke-width="0.8"/>
        <text x="498" y="121" fill="#4a5278" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="568" y="140" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Drift tables</text>
        <text x="568" y="156" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deck · card · tags · srs …</text>

        <!-- Node: SyncScheduler (backend) -->
        <rect x="48" y="264" width="152" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="48" y="264" width="152" height="64" rx="6" fill="#ffffff" stroke="#0f1638" stroke-width="1"/>
        <rect x="56" y="272" width="24" height="12" rx="2" fill="transparent" stroke="rgba(15,22,56,0.40)" stroke-width="0.8"/>
        <text x="68" y="281" fill="#0f1638" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
        <text x="124" y="300" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">SyncScheduler</text>
        <text x="124" y="316" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">debounce · backoff</text>

        <!-- Node: SyncCoordinator (focal) -->
        <rect x="264" y="264" width="152" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="264" y="264" width="152" height="64" rx="6" fill="rgba(82,101,245,0.08)" stroke="#4151c6" stroke-width="1"/>
        <rect x="272" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(65,81,198,0.50)" stroke-width="0.8"/>
        <text x="286" y="281" fill="#4151c6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
        <text x="340" y="300" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">SyncCoordinator</text>
        <text x="340" y="316" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push first, then pull</text>

        <!-- Node: sync_outbox (focal) -->
        <rect x="480" y="264" width="176" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="480" y="264" width="176" height="64" rx="6" fill="rgba(82,101,245,0.08)" stroke="#4151c6" stroke-width="1"/>
        <rect x="488" y="272" width="40" height="12" rx="2" fill="transparent" stroke="rgba(65,81,198,0.50)" stroke-width="0.8"/>
        <text x="508" y="281" fill="#4151c6" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTBOX</text>
        <text x="568" y="300" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">sync_outbox</text>
        <text x="568" y="316" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">op_id · upsert | delete</text>

        <!-- Node: SupabaseSyncApi (backend) -->
        <rect x="264" y="424" width="152" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="264" y="424" width="152" height="64" rx="6" fill="#ffffff" stroke="#0f1638" stroke-width="1"/>
        <rect x="272" y="432" width="24" height="12" rx="2" fill="transparent" stroke="rgba(15,22,56,0.40)" stroke-width="0.8"/>
        <text x="284" y="441" fill="#0f1638" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="340" y="460" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">SupabaseSyncApi</text>
        <text x="340" y="476" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">timeout per RPC</text>

        <!-- Node: RPC Supabase (external) -->
        <rect x="736" y="424" width="176" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="736" y="424" width="176" height="64" rx="6" fill="rgba(15,22,56,0.03)" stroke="rgba(15,22,56,0.30)" stroke-width="1"/>
        <rect x="744" y="432" width="24" height="12" rx="2" fill="transparent" stroke="rgba(15,22,56,0.22)" stroke-width="0.8"/>
        <text x="756" y="441" fill="#7c85ab" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RPC</text>
        <text x="824" y="460" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">RPC Supabase</text>
        <text x="824" y="476" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sync_push · sync_changes</text>

        <!-- Node: Postgres (store) -->
        <rect x="736" y="264" width="176" height="64" rx="6" fill="#f7f9fe"/>
        <rect x="736" y="264" width="176" height="64" rx="6" fill="rgba(15,22,56,0.05)" stroke="#4a5278" stroke-width="1"/>
        <rect x="744" y="272" width="20" height="12" rx="2" fill="transparent" stroke="rgba(74,82,120,0.50)" stroke-width="0.8"/>
        <text x="754" y="281" fill="#4a5278" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PG</text>
        <text x="824" y="300" fill="#0f1638" font-size="12" font-weight="600" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">Postgres</text>
        <text x="824" y="316" fill="#4a5278" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private · RLS on, no policy</text>

        <!-- Callout: why a pull does not echo back -->
        <path d="M 644,380 Q 644,352 640,332" fill="none" stroke="rgba(15,22,56,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="640" cy="330" r="2" fill="#0f1638"/>
        <text font-size="12" font-style="italic" font-weight="500" font-family="'Plus Jakarta Sans', sans-serif" fill="#0f1638" text-anchor="end">
          <tspan x="656" y="392">pulls write under</tspan>
          <tspan x="656" y="408">applying_remote: triggers</tspan>
          <tspan x="656" y="424">skip, nothing echoes back</tspan>
        </text>

        <!-- Legend strip -->
        <line x1="24" y1="528" x2="936" y2="528" stroke="rgba(15,22,56,0.10)" stroke-width="0.8"/>
        <text x="24" y="546" fill="#4a5278" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="24" y="560" width="14" height="10" rx="2" fill="rgba(82,101,245,0.08)" stroke="#4151c6" stroke-width="1"/>
        <text x="44" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">Focal</text>

        <rect x="100" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#0f1638" stroke-width="1"/>
        <text x="120" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">App code</text>

        <rect x="188" y="560" width="14" height="10" rx="2" fill="rgba(15,22,56,0.05)" stroke="#4a5278" stroke-width="1"/>
        <text x="208" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">Store</text>

        <rect x="264" y="560" width="14" height="10" rx="2" fill="rgba(15,22,56,0.03)" stroke="rgba(15,22,56,0.30)" stroke-width="1"/>
        <text x="284" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">External service</text>

        <rect x="388" y="560" width="14" height="10" rx="2" fill="rgba(74,82,120,0.10)" stroke="#7c85ab" stroke-width="1"/>
        <text x="408" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">UI</text>

        <line x1="448" y1="565" x2="476" y2="565" stroke="#4a5278" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="484" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">Local data</text>

        <line x1="560" y1="565" x2="588" y2="565" stroke="#6c59c6" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="596" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">Network call</text>

        <line x1="684" y1="565" x2="712" y2="565" stroke="#4a5278" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="720" y="568" fill="#4a5278" font-size="8.5" font-family="'Plus Jakarta Sans', sans-serif">Triggers a run</text>
      </svg>
    </div>
  </div>
</body>
</html>
