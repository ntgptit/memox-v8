name: Build APK

# Manual only. Builds one universal release APK and publishes it as a GitHub
# pre-release (downloadable from Releases, never labelled "Latest"), then
# deletes CI-built releases older than 7 days.
# Spec: docs/superpowers/specs/2026-09-23-build-apk-release-design.md
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    name: build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # android/app/build.gradle.kts targets JavaVersion.VERSION_17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: pub get
        run: flutter pub get

      # Generated code is not committed (.gitignore: *.g.dart).
      - name: generate
        run: dart run build_runner build --delete-conflicting-outputs

      # The release key (supabase/README.md, "Sign-in setup"): the keystore
      # goes outside the checkout, android/key.properties (git-ignored) points
      # at it. Without the secrets the APK keeps the debug key, and native
      # Google sign-in cannot match it.
      - name: release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::warning::The ANDROID_KEY* secrets are not all set; this APK is signed with a debug key, so Google sign-in will not work on it."
            exit 0
          fi
          keystore="$RUNNER_TEMP/memox-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      # ADR-015: sync runs only when the build defines both values
      # (lib/core/network/supabase_config.dart); the file lives outside the checkout.
      - name: build APK
        id: build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Native Google sign-in (auth spec O11, supabase/README.md SB-A4);
          # empty leaves email sign-in only.
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::warning::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is not set; this APK builds without sync."
          fi
          defines="$RUNNER_TEMP/dart-defines.json"
          jq -n '{SUPABASE_URL: env.SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY: env.SUPABASE_PUBLISHABLE_KEY, GOOGLE_WEB_CLIENT_ID: env.GOOGLE_WEB_CLIENT_ID}' > "$defines"
          flutter build apk --release --dart-define-from-file="$defines"
          sha8="${GITHUB_SHA:0:8}"
          name="memox-${GITHUB_RUN_NUMBER}-${sha8}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$name"
          {
            echo "apk=$name"
            echo "tag=build-${GITHUB_RUN_NUMBER}-${sha8}"
          } >> "$GITHUB_OUTPUT"

      # The SHA-1 to register as an Android OAuth client (SB-A4 step 1.3).
      - name: signer
        env:
          APK: ${{ steps.build.outputs.apk }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          signer="$("$apksigner" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-1)')"
          {
            echo '### APK signer'
            echo '```'
            echo "$signer"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A release key was given, yet Gradle signed with the debug key.
          if [[ -f android/key.properties ]] && grep -q 'CN=Android Debug' <<<"$signer"; then
            echo "::error::android/key.properties exists but the APK is signed with the debug key."
            exit 1
          fi

      # A re-run of the same run reuses the tag; the script replaces the asset.
      - name: publish pre-release
        env:
          APK: ${{ steps.build.outputs.apk }}
          TAG: ${{ steps.build.outputs.tag }}
        run: bash .github/scripts/publish-build-release.sh "$APK" "$TAG"

      # Runs only when every step above succeeded, so a failed build never
      # deletes the previous APKs.
      - name: delete CI releases older than 7 days
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,createdAt \
            | bash .github/scripts/expired-build-releases.sh > expired.txt
          echo "### Deleted releases older than 7 days" >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -s expired.txt ]]; then
            echo "None." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          while IFS= read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
            echo "- \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done < expired.txt
