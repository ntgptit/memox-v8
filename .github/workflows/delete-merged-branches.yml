# Deletes branches whose work has been merged (owner's request, 2026-09-29).
# A branch goes only when its tip is exactly the head of a merged pull request
# of this repository: a branch with commits after the merge, a branch whose PR
# was closed unmerged, a branch with no PR, the default branch and protected
# branches are never touched.
name: delete merged branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List the branches that would be deleted, delete nothing
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: delete-merged-branches
  cancel-in-progress: false

jobs:
  # The merged PR's own branch, right after the merge.
  on-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # Passed through env, never inlined: a branch name is user input.
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: delete the merged head branch
        run: |
          if [ "$HEAD_REF" = "$DEFAULT_BRANCH" ]; then
            echo "The default branch is never deleted."
            exit 0
          fi
          if ! tip="$(gh api "repos/$REPO/git/ref/heads/$HEAD_REF" --jq .object.sha 2>/dev/null)"; then
            echo "Branch $HEAD_REF is already gone."
            exit 0
          fi
          if [ "$tip" != "$HEAD_SHA" ]; then
            echo "Branch $HEAD_REF has commits after PR #$PR_NUMBER was merged; kept."
            exit 0
          fi
          protected="$(gh api "repos/$REPO/branches/$HEAD_REF" --jq .protected)"
          if [ "$protected" = "true" ]; then
            echo "Branch $HEAD_REF is protected; kept."
            exit 0
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF"
          echo "Deleted $HEAD_REF (merged in #$PR_NUMBER)." | tee -a "$GITHUB_STEP_SUMMARY"

  # Every branch left over from earlier merges.
  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      # A scheduled run has no inputs, so it deletes; a manual run dry-runs unless told not to.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: find and delete merged branches
        run: |
          # "<branch> <sha>" for every head of a merged PR from this repository.
          gh api --paginate "repos/$REPO/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == env.REPO) | "\(.head.ref) \(.head.sha)"' \
            | sort -u > merged_heads.txt
          # "<branch> <sha> <protected>" for every branch.
          gh api --paginate "repos/$REPO/branches?per_page=100" \
            --jq '.[] | "\(.name) \(.commit.sha) \(.protected)"' > branches.txt

          deleted=0
          {
            echo "| Branch | Action |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name sha protected; do
            if [ "$name" = "$DEFAULT_BRANCH" ] || [ "$protected" = "true" ]; then
              continue
            fi
            if ! grep -qxF "$name $sha" merged_heads.txt; then
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "| \`$name\` | would delete |" >> "$GITHUB_STEP_SUMMARY"
            else
              gh api -X DELETE "repos/$REPO/git/refs/heads/$name"
              echo "| \`$name\` | deleted |" >> "$GITHUB_STEP_SUMMARY"
            fi
            deleted=$((deleted + 1))
          done < branches.txt
          echo "$deleted merged branch(es) $([ "$DRY_RUN" = "true" ] && echo 'found (dry run)' || echo 'deleted')."
