# ADR-015: the migrations in supabase/migrations reach the project only through this workflow.
# pgTAP gates the push, and after it the project must match the migrations exactly (SB-O5).
name: supabase migrations

on:
  push:
    branches: [master]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: hgacyucfagsvolymlqto
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; the migrations were not pushed."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # A migration that fails pgTAP never reaches the project.
      - name: start local database
        run: supabase db start

      - name: pgTAP
        run: supabase test db

      - name: link
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: migrations before
        run: supabase migration list

      - name: push
        run: supabase db push

      - name: migrations after
        run: supabase migration list

      # After the push the project must equal the migrations; anything left is a
      # change made outside a migration (for example in the SQL Editor). Checked
      # after the push because before it the pending migrations would count as
      # drift. `db diff` prints the difference as SQL on stdout and exits 0.
      # Exempt: public.rls_auto_enable(), the event-trigger function Supabase
      # created with the project to switch RLS on for new tables (owner's ruling
      # 2026-09-28, supabase/README.md). Only its CREATE block and its GRANTs are
      # dropped; any other statement, `SET` aside, is drift.
      - name: schema matches migrations
        run: |
          supabase db diff --linked --schema public,private > drift.sql
          awk '
            /^CREATE OR REPLACE FUNCTION public\.rls_auto_enable\(\)/ { skip = 1 }
            skip { if ($0 == "$function$;") skip = 0; next }
            /^(GRANT|REVOKE) .* ON FUNCTION "public"\."rls_auto_enable"\(\)/ { next }
            /^SET local check_function_bodies = off;$/ { next }
            NF { print }
          ' drift.sql > unexpected.sql
          if [ -s unexpected.sql ]; then
            echo "::error::The project schema differs from supabase/migrations: a change was made outside a migration. Undo it or capture it in a migration."
            cat drift.sql
            exit 1
          fi
          echo "The project schema matches supabase/migrations."
