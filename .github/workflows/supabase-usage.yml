# SB-O8: how close the Free project is to its limits (ADR-015: 500 MB database, 50,000 MAU).
# Reads through the Management API with the access token only; fails at 80% of a limit,
# and GitHub emails the owner when a scheduled run fails.
name: supabase usage

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: hgacyucfagsvolymlqto
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_LIMIT_BYTES: '524288000'
      MAU_LIMIT: '50000'
      ALERT_PERCENT: '80'
    steps:
      - name: secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set; usage was not read."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # active_30d approximates MAU: a sign-in or a session refresh in the last 30 days.
      - name: read usage
        run: |
          supabase db query --linked --project-ref "$SUPABASE_PROJECT_REF" --output-format json "
            select pg_database_size(current_database()) as db_bytes,
                   (select count(*) from auth.users) as users,
                   (select count(*) from auth.users u
                     where u.last_sign_in_at > now() - interval '30 days'
                        or exists (select 1 from auth.sessions s
                                    where s.user_id = u.id
                                      and s.updated_at > now() - interval '30 days')) as active_30d
          " > usage.json
          cat usage.json

      - name: report
        run: |
          row() { jq -r --arg k "$1" '[.. | objects | select(has("db_bytes"))][0][$k]' usage.json; }
          db_bytes="$(row db_bytes)"
          users="$(row users)"
          active="$(row active_30d)"
          case "$db_bytes$users$active" in
            *[!0-9]*|'') echo "::error::Could not read usage from the query result."; exit 1 ;;
          esac
          db_percent=$(( db_bytes * 100 / DB_LIMIT_BYTES ))
          mau_percent=$(( active * 100 / MAU_LIMIT ))
          {
            echo "| Measure | Value | Share of Free limit |"
            echo "|---|---|---|"
            echo "| Database size | $(( db_bytes / 1024 / 1024 )) MB | ${db_percent}% of 500 MB |"
            echo "| Users | $users | — |"
            echo "| Active in 30 days (≈ MAU) | $active | ${mau_percent}% of $MAU_LIMIT |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "database ${db_percent}%, active users ${mau_percent}% of the Free limits"
          if [ "$db_percent" -ge "$ALERT_PERCENT" ] || [ "$mau_percent" -ge "$ALERT_PERCENT" ]; then
            echo "::error::The project is at ${ALERT_PERCENT}% or more of a Free limit (database ${db_percent}%, active users ${mau_percent}%)."
            exit 1
          fi
