include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    # drift's migration test helpers (`schema generate`), which nobody edits.
    - test/drift/generated/**
    # The guard's Dart fixtures are snippets a rule reads as text, not code to
    # compile (e.g. derived_color/invalid.dart names identifiers it never defines).
    - code-verification-guard-v2/tests/fixtures/**
    - build/**
    - android/**

linter:
  rules:
    always_use_package_imports: true
    avoid_print: true
    prefer_const_constructors: true
