version: 1
metadata:
  id: memox-v7-ruleset-scopes
  name: MemoX V7 Ruleset Scopes
  description: >-
    Scopes for the memox-v7 repo layout, which is feature-first and differs from
    every earlier MemoX ruleset. Product code lives in lib/features/<feature>/
    {domain,data,presentation}; cross-cutting code in lib/core and lib/shared;
    the app shell in lib/app. Generated code (*.g.dart, *.freezed.dart,
    *.drift.dart, l10n output) is excluded everywhere — it is not hand-written
    and linting it produces noise nobody can act on. The vendored guard itself
    (code-verification-guard-v2/**) is excluded from every scope: it is Python
    tooling, not app source. Cross-feature import direction (feature A must not
    import feature B) cannot be expressed as a per-file regex; that check is
    owned by .claude/skills/flutter-architecture/scripts/check_architecture.sh.
scopes:
  # ---- Shared-scope remaps (names required by common / dart / flutter sets) ----
  project_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - .fvmrc
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  all_text_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  text_source_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  source_files:
    include:
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  source_and_config_files:
    include:
      - pubspec.yaml
      - analysis_options.yaml
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  dart_source:
    include:
      - lib/**/*.dart
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  dart_lib:
    include:
      - lib/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  flutter_source:
    include:
      - lib/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**
  flutter_app_source:
    include:
      - lib/**/*.dart
    exclude:
      - lib/core/theme/**
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
      - lib/l10n/generated/**
      - lib/l10n/app_localizations*.dart
      - build/**
      - '**/.dart_tool/**'
      - code-verification-guard-v2/**

  # ---- memox-v7 layer scopes ----
  # Layer boundaries per CLAUDE.md "Layering". These three are the load-bearing
  # scopes: most architecture rules are just "this pattern, in this layer".
  domain_files:
    include:
      - lib/features/*/domain/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
  data_files:
    include:
      - lib/features/*/data/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'
  presentation_files:
    include:
      - lib/features/*/presentation/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Business layers that must NOT branch on StudyMode. Dispatch belongs to one
  # exhaustive switch beside the enum, in `study_mode.dart` (AD-18); a handler
  # owns its own mode, so it never needs to ask. presentation/ is deliberately
  # absent: mapping a mode to a label or an icon is presentation, not policy, and
  # forbidding it there would push that mapping somewhere worse.
  #
  # `**/*_mode.dart` is the one exemption, and it is the only one that can be.
  # This scope used to exempt `study_mode_resolver.dart` as well — a file that
  # cannot exist: `memox.naming.domain_file_role_suffix` admits no `_resolver`
  # suffix under domain/, so the two rules could never both be satisfied by that
  # name. Dead config in a guard is worse than no config: it reads as a
  # permission somebody relied on, and the next reader spends time looking for
  # the file it protects.
  study_mode_non_dispatch:
    include:
      - lib/features/*/domain/**/*.dart
      - lib/features/*/data/**/*.dart
    exclude:
      - '**/*_mode.dart'
      - '**/*.g.dart'
      - '**/*.freezed.dart'
      - '**/*.drift.dart'

  # Everything that is NOT allowed to open a transaction or touch a DAO.
  non_data_layer_source:
    include:
      - lib/app/**/*.dart
      - lib/shared/**/*.dart
      - lib/features/*/domain/**/*.dart
      - lib/features/*/presentation/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Widgets and screens — the surfaces that must not reach past their layer.
  widget_ui_files:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/widgets/**/*.dart
    exclude:
      - '**/*_controller.dart'
      - '**/*_state.dart'
      # `presentation/providers/` — added at M4.10 with the use-case layer. A file
      # whose whole job is dependency wiring reads a repository *by definition*
      # and hands it to a use case that the widgets then reach through a
      # controller. Excluding it keeps `widget_no_repository_access` pointed at
      # the thing it is for: a widget skipping its controller.
      - '**/*_provider.dart'
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Product UI only. lib/app/** is deliberately OUT: it is the dev-channel shell
  # (MobileFrameWidget's backdrop colour is not product UI and is documented as
  # such), and lib/core/theme/** is where raw values are legitimately defined.
  ui_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Product UI *plus* the theme, for the rules where "where tokens are defined"
  # is not an exemption but the very place the regression happens.
  #
  # `ui_surfaces` excludes `lib/core/theme/**` because a raw colour or radius
  # there IS the token — linting it would be flagging the definition as the
  # crime. A duration is not like that. `AppDurations` declares its three rungs
  # as *named* constants, and so does every legitimate non-motion duration in
  # the repo, so the theme directory has nothing that needs the exemption — and
  # it is exactly where `Duration(milliseconds: 500)` sat anonymously inside
  # `tooltipTheme` until M4.10ao. A rule scoped to `ui_surfaces` alone could not
  # catch the case it was written for.
  ui_and_theme_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/core/theme/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # **Typography only, plus `lib/app/`** (A20.1 P2-22). The composition root
  # was in no typography scope, and `error_screen_widget.dart` — the one
  # screen that must render with no `Theme` — set two literal sizes in the
  # platform font because nothing looked. It builds from `AppTypography` now;
  # these two scopes are what keep it there. Colour is *not* widened: the
  # error screen's fallback palette and `MobileFrameWidget` hold literals for
  # reasons their files state, and the colour rules keep their scopes.
  typography_ui_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/app/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  typography_and_theme_surfaces:
    include:
      - lib/features/*/presentation/**/*.dart
      - lib/shared/**/*.dart
      - lib/core/theme/**/*.dart
      - lib/app/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  # Riverpod-owned files: controllers, notifiers and generated-provider sources.
  # The theme alone — where `ColorScheme` is constructed and the one place a
  # retired role could be handed a value. Product UI never builds a scheme, so
  # a rule about the scheme's argument list has nothing to say outside here.
  theme_files:
    include:
      - lib/core/theme/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  provider_files:
    include:
      - lib/**/controller/**/*.dart
      - lib/**/*_controller.dart
      - lib/**/*_provider.dart
      - lib/**/providers/**/*.dart
      - lib/core/providers/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  controller_files:
    include:
      - lib/**/*_controller.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  database_files:
    include:
      - lib/core/database/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.drift.dart'

  drift_sql_files:
    include:
      - lib/**/*.drift
    exclude: []

  test_files:
    include:
      - test/**/*.dart
      - integration_test/**/*.dart
    exclude:
      - '**/*.g.dart'
      - '**/*.freezed.dart'

  pubspec_manifest:
    include:
      - pubspec.yaml
    exclude: []
