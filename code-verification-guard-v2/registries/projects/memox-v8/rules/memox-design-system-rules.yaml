# MemoX V8 guard rules — domain: design_system
#
# The design system's component boundary: a feature composes shared primitives
# (`Mx*`), it does not rebuild them from raw Material widgets. The shared
# widgets say so in their own documentation, but prose on a shared widget is
# read by the person editing the shared widget, not by the person writing a
# new dialog in a feature; these rules are what enforce it.
#
# Scope note: `presentation_files` (features/*/presentation only), NOT
# `ui_surfaces` — `lib/shared/` is where the primitives legitimately build the
# raw widgets these rules ban. Linting it would flag the definition as the
# crime, the same argument `memox-design-token-rules.yaml` makes for
# `lib/core/theme/`.
version: 1
metadata:
  id: memox-v8-design-system
  name: MemoX V8 Design System Rules
  description: >-
    Features compose shared Mx primitives; raw Material control widgets stay in
    lib/shared where the primitives are defined.
  owner: memox-v8
rules:
  - id: memox_v8.design_system.no_raw_button
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw Material buttons in feature code. Use `MxButton` (tones: primary /
      secondary / outline / text / destructive / dangerTint / warning; sizes:
      regular / small / chip / study) or the other shared button primitives
      (`MxIconButton`, `MxFab`), so every action in the app resolves through one
      style pipeline. A shape the shared widget cannot express is a gap in the
      widget — extend it in lib/shared, do not route around it here.
    scopes:
      - presentation_files
    # `\b` keeps a longer name that ends in one of these (an `Mx…` wrapper, say)
    # legal without a lookbehind: the letters either side are word characters,
    # so there is no boundary inside the name.
    patterns:
      - '\bElevatedButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bFilledButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bOutlinedButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
      - '\bTextButton(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
    tags:
      - memox-v8
      - design-system

  # Every pattern below is line-anchored with the comment exemption the
  # duration rule uses: prose that *names* a banned widget must not trip the
  # rule that bans it.
  - id: memox_v8.design_system.no_raw_widget
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw Material component widgets in feature code. Use the Mx shared
      primitive (`MxCard`, `MxListRow`, `MxIconButton`, `MxFab`, `MxOptionRow`,
      `MxToggle`, dialogs through `showMxDialog`, …) so the component's visual
      grammar has one owner. A widget with no Mx wrapper yet goes through the
      admission rule in the forui-shared-widgets skill first — an Mx facade on
      ForUI, its tests, then the feature — never raw-first.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:Card|ListTile|IconButton|FloatingActionButton|InkResponse|ExpansionTile|Badge)\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Checkbox|Radio|TextFormField|Slider|RangeSlider|SegmentedButton|ToggleButtons)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:NavigationBar|NavigationDrawer|NavigationRail|BottomNavigationBar|BottomAppBar|TabBar)\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Dialog|AlertDialog|SimpleDialog|MaterialBanner|SearchBar|SearchAnchor|DropdownMenu)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\bshowDialog\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:SnackBar|SnackBarAction|InkWell)\s*\('
      - '^(?!\s*(?://|\*)).*\.showSnackBar\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:Switch|SwitchListTile|CheckboxListTile|RadioListTile|RadioGroup)\s*[<(]'
      - '^(?!\s*(?://|\*)).*\b(?:PopupMenuButton|PopupMenuItem|DropdownButton|DropdownButtonHideUnderline)\s*[<(]'
    tags:
      - memox-v8
      - design-system

  # Two ratchets: neither name appears in `lib/features/*/presentation/`, so
  # neither can go red on existing code. They exist so the next screen cannot
  # quietly build its own chrome or its own pick-one control.
  #
  # `Scaffold` is deliberately NOT here. It is the framework's layout host, not
  # a design-system component: no architecture decision forbids a feature from
  # owning one, and `MxAppShell` builds its own for a reason its file states —
  # that is not a prohibition on features.
  - id: memox_v8.design_system.no_raw_screen_chrome
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw screen chrome in feature code. `MxAppShell` lays out the chrome and
      `MxAppBar` owns the bar and its back control, so every screen's chrome
      resolves through one owner. A bar they cannot express is a gap in them —
      extend them in lib/shared, do not build an `AppBar` / `SliverAppBar` here.
    scopes:
      - presentation_files
    # Line-anchored with the comment exemption every rule in this file uses.
    # `\b` keeps `MxAppBar`-style names legal and `\s*\(` keeps `AppBarTheme(`
    # (a theme, not chrome) legal.
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:AppBar|SliverAppBar)\s*\('
    tags:
      - memox-v8
      - design-system

  # A sheet opens through `showMxBottomSheet`, the one route that carries the
  # theme's surface, radius and scrim.
  - id: memox_v8.design_system.no_raw_sheet_route
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw bottom-sheet route in feature code. `showMxBottomSheet` owns the
      route, the scrim and the motion, and `MxBottomSheet` keeps its header and
      footer in view while only the body scrolls; each caller deciding those is
      how one sheet ends up under the navigation bar and another under the
      status bar. Open the sheet through
      lib/shared/widgets/mx_bottom_sheet.dart.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\bshow(?:Modal)?BottomSheet\s*[<(]'
    tags:
      - memox-v8
      - design-system

  # A ring or bar that shows `value:` is progress, not loading, and the shared
  # widgets own both kinds: a feature needs no raw indicator at all.
  - id: memox_v8.design_system.no_raw_loading_indicator
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw progress indicator in feature code. A wait shows `MxSpinner` or
      the `MxSkeleton` family, which carry the accessible name a bare spinner
      lacks; progress shown with `value:` is `MxLinearProgress` or
      `MxMasteryDonut`.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:CircularProgressIndicator|LinearProgressIndicator)(?:\.adaptive)?\s*\('
    tags:
      - memox-v8
      - design-system

  # `MxFilterChip` owns the pick-one chip; this rule bans the raw `ChoiceChip`.
  - id: memox_v8.design_system.no_raw_choice_chip
    type: regex
    severity: error
    enabled: true
    message: >-
      No raw `ChoiceChip` in feature code. `MxFilterChip` owns the pick-one
      chip — its selection is state a screen reader announces, not only a look —
      so every such chip in the app is one component.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\bChoiceChip(?:\.[A-Za-z_][A-Za-z0-9_]*)?\s*\('
    tags:
      - memox-v8
      - design-system

  - id: memox_v8.design_system.no_raw_style_escape
    type: regex
    severity: error
    enabled: true
    message: >-
      No hand-built styles in feature code. `ButtonStyle`, `styleFrom`,
      `BorderSide`, `BoxShadow`, `ShapeDecoration`, `RoundedRectangleBorder`,
      `WidgetStateProperty` and literal icon sizes are the design system's
      vocabulary — a feature that needs one is describing a variant the shared
      widget should own. Extend the Mx widget or the theme in lib/shared /
      lib/core/theme, then select it semantically here.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\b(?:ButtonStyle|BorderSide|BoxShadow|ShapeDecoration|RoundedRectangleBorder)\s*\('
      - '^(?!\s*(?://|\*)).*\.styleFrom\s*\('
      - '^(?!\s*(?://|\*)).*\b(?:WidgetStateProperty|MaterialStateProperty)\b'
      - '^(?!\s*(?://|\*)).*\bIcon\s*\([^)]*\bsize\s*:\s*\d'
    tags:
      - memox-v8
      - design-system

  - id: memox_v8.design_system.no_flat_style_from
    type: regex
    severity: error
    enabled: true
    message: >-
      No `styleFrom(` in widgets — feature or shared. `styleFrom` builds flat
      Material values that shadow every state at once, so a pressed or
      disabled state stops showing. State styles come from ForUI's variant
      styles (`FVariants`, a style delta in the Mx widget); V8 calls
      `styleFrom` nowhere, the theme included.
    scopes:
      - widget_ui_files
    patterns:
      - '^(?!\s*(?://|\*)).*\.styleFrom\s*\('
    tags:
      - memox-v8
      - design-system

  # The weight belongs to the role: `MxTextRoles` in `app_typography.dart` sets
  # it through `_weighted`, never as a `fontWeight: FontWeight.` argument.
  - id: memox_v8.design_system.no_bare_font_weight
    type: regex
    severity: error
    enabled: true
    message: >-
      Never set `fontWeight:` by hand. A weight is part of its role in
      `MxTextRoles` (lib/core/theme/app_typography.dart); the fonts ship the
      400, 500 and 600 the roles use, so any other weight is synthesised.
    scopes:
      - typography_and_theme_surfaces
    patterns:
      - '^(?!\s*(?://|\*)).*\bfontWeight\s*:\s*FontWeight\.'
    tags:
      - memox-v8
      - design-system
      - typography

  # A widget reads a role; it changes only its colour or its face (ADR-026).
  # The scope is the whole UI surface: features *and* `lib/shared/`. File
  # mode, because `dart format` writes a `copyWith(` over several lines and a
  # line-scoped pattern could not see its arguments.
  #
  # What it cannot see is a restyle through a local alias
  # (`final text = texts.bodyMedium!; text.copyWith(color:)`): that takes a
  # two-pass scan a regex cannot be.
  - id: memox_v8.design_system.no_text_restyle
    type: regex
    mode: file
    severity: error
    enabled: true
    message: >-
      No per-site text styling in UI code. Read a role from `context.texts`
      (the twelve Design System roles) and change only its colour,
      `copyWith(color: …)`, or switch to the mono face,
      `copyWith(fontFamily: AppTypography.monoFamily)`, or both in one
      call; never a second `copyWith(` or an `apply(`. A size, weight,
      height or spacing the roles cannot express is a Design System change:
      a role in `lib/core/theme/app_typography.dart`
      (docs/agent/visual-change.md).
    scopes:
      - ui_surfaces
    exclude:
      # The struck-through wrong answer of a Fill session: the colour plus a
      # line-through and its colour, a mark of the answer, not a restyle
      # (screen 16e). No role carries a decoration.
      - lib/features/study/presentation/widgets/sections/study_fill_widget.dart
    patterns:
      # A `copyWith(` on a role whose arguments are not exactly `color: …`,
      # `fontFamily: AppTypography.monoFamily`, or the two together. An
      # argument may hold parentheses three deep (a call inside a ternary
      # inside a call).
      - '^(?!\s*(?://|\*)).*\btexts\.[a-zA-Z]+[!?]?\s*\.copyWith\s*\((?!(?:\s*color\s*:(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+|\s*fontFamily\s*:\s*AppTypography\.monoFamily\s*|\s*color\s*:(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+,\s*fontFamily\s*:\s*AppTypography\.monoFamily\s*|\s*fontFamily\s*:\s*AppTypography\.monoFamily\s*,\s*color\s*:(?:[^,()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))+),?\s*\))'
      # A second `copyWith(` or an `apply(` after the allowed one restyles
      # all the same, across lines too.
      - '^(?!\s*(?://|\*)).*\btexts\.[a-zA-Z]+[!?]?\s*\.copyWith\s*\((?:[^()]|\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*\))*\)\s*[!?]?\s*\.(?:copyWith|apply)\s*\('
      # `apply(` scales or replaces a role's metrics.
      - '^(?!\s*(?://|\*)).*\btexts\.[a-zA-Z]+[!?]?\s*\.apply\s*\('
      - '^(?!\s*(?://|\*)).*\btextTheme\.[a-zA-Z]+[!?]?\s*\.copyWith\s*\('
    tags:
      - memox-v8
      - design-system
      - typography

  # A colour on a raw `Icon` is an open colour on a glyph; `MxIconTile` and
  # `MxIconButton` own the coloured glyph. A colour computed by a
  # `….resolve(…)` call stays legal: it comes out of a theme-owned set.
  - id: memox_v8.design_system.no_raw_icon_color
    type: regex
    severity: error
    enabled: true
    message: >-
      No open `Icon(color:)` in feature code. A coloured glyph is an
      `MxIconTile` (tones: tinted / primary / warning / success / caution /
      danger / neutral) or an `MxIconButton`; an `Icon` that must stay raw takes its
      colour from a theme-owned set through `….resolve(…)`.
    scopes:
      - presentation_files
    patterns:
      - '^(?!\s*(?://|\*)).*\bIcon\s*\([^)]*\bcolor\s*:\s*(?![A-Za-z_][\w.]*\.resolve\()'
    tags:
      - memox-v8
      - design-system

  # ADR-026: `context.colors` is ForUI's FColors, and the guard locks the
  # names read from it to FColors' roles and its two state helpers (`hover`,
  # `disable`), by allowlist: a Material 3 role name (`onSurfaceVariant`,
  # `surfaceContainerHigh`) on it is the old theme coming back. Comment lines
  # are exempt because prose names files such as `colors.css`; `?.` is
  # accepted so a nullable palette is not a way around the rule. A semantic
  # colour is `context.status` (MxStatusColors), not an FColors role.
  - id: memox_v8.design_system.colors_reads_are_forui_roles
    type: regex
    severity: error
    enabled: true
    message: >-
      Read `context.colors` (ForUI FColors) through one of its roles:
      background, foreground, primary, primaryForeground, secondary,
      secondaryForeground, muted, mutedForeground, destructive, error,
      errorForeground, card, border, barrier, or `hover(…)` / `disable(…)`.
      A Material 3 role name is the removed theme; success, warning and info
      are `context.status`.
    scopes:
      - dart_lib
    patterns:
      - '^(?!\s*//).*?\bcolors\??\.(?!(?:brightness|systemOverlayStyle|barrier|background|foreground|primaryForeground|primary|secondaryForeground|secondary|mutedForeground|muted|destructiveForeground|destructive|errorForeground|error|card|border|hoverLighten|hoverDarken|disabledOpacity|hover|disable|extension|copyWith)\b)[A-Za-z_]\w*'
    tags:
      - memox-v8
      - design-system

  # The SDK host theme (`materialHostTheme` in app_theme.dart, the only
  # `ColorScheme` lib/ builds; tools/ui_lint UIL05 keeps the rest out) is
  # mapped from FColors onto the 45 Material 3 roles, plus `brightness`. Any
  # other argument name is a deprecated role or a mechanism the SDK resolves
  # for itself. File mode: `dart format` puts every argument of a call this
  # long on its own line.
  - id: memox_v8.design_system.host_scheme_arguments_are_m3_roles
    type: regex
    mode: file
    severity: error
    enabled: true
    message: >-
      The SDK host `ColorScheme` is built from the 45 Material 3 colour roles
      only, plus `brightness`, each mapped from an FColors role. Any other
      argument name is a deprecated role or a mechanism the SDK resolves.
    scopes:
      - dart_lib
    patterns:
      - '(?:\b(?:sdk\.)?ColorScheme(?:\.(?:light|dark|highContrastLight|highContrastDark))?|\bcolorScheme\??\.copyWith)\s*\((?:[^()]|\((?:[^()]|\([^()]*\))*\))*?^\s+(?!(?:brightness|surfaceContainerHighest|onSecondaryFixedVariant|surfaceContainerLowest|onTertiaryFixedVariant|onPrimaryFixedVariant|onSecondaryContainer|surfaceContainerHigh|onTertiaryContainer|surfaceContainerLow|onPrimaryContainer|secondaryContainer|tertiaryContainer|secondaryFixedDim|primaryContainer|onErrorContainer|onSurfaceVariant|onInverseSurface|surfaceContainer|onSecondaryFixed|tertiaryFixedDim|primaryFixedDim|onTertiaryFixed|errorContainer|outlineVariant|inverseSurface|inversePrimary|onPrimaryFixed|secondaryFixed|surfaceBright|tertiaryFixed|primaryFixed|onSecondary|onTertiary|surfaceDim|onPrimary|secondary|onSurface|tertiary|primary|onError|surface|outline|shadow|error|scrim)\s*:)[A-Za-z_]\w*\s*:'
    tags:
      - memox-v8
      - design-system

  # ADR-026: features compose the Mx widgets; ForUI is the component system
  # under them, not a second vocabulary beside them. The same boundary is
  # tools/ui_lint UIL06, resolved; this rule says it at edit time.
  - id: memox_v8.design_system.no_forui_in_features
    type: regex
    severity: error
    enabled: true
    message: >-
      No `package:forui` in feature code. Compose the Mx widgets in
      lib/shared/widgets; a ForUI component a feature needs is a new or
      extended Mx widget first.
    scopes:
      - presentation_files
    patterns:
      - '^\s*import\s+.package:forui/'
    tags:
      - memox-v8
      - design-system

  # ADR-026: Material is infrastructure (the app host, page routes, motion
  # constants), imported by name. A whole `material.dart` import brings back
  # the Material components ForUI replaced. tools/ui_lint UIL03 checks the
  # names; this rule catches the whole import at edit time.
  - id: memox_v8.design_system.material_imported_by_name
    type: regex
    severity: error
    enabled: true
    message: >-
      Import Material only through a `show` list of infrastructure names
      (MaterialApp, Scaffold in MxAppShell, MaterialPageRoute,
      RefreshIndicator, Durations, Easing, …; tools/ui_lint/ui_rules.dart).
      UI is ForUI through the Mx widgets.
    scopes:
      - ui_surfaces
    patterns:
      - '^\s*import\s+.package:(?:flutter/material\.dart|material_ui/material_ui\.dart).\s*;'
    tags:
      - memox-v8
      - design-system

  # A row's leading and trailing marks — a status dot, a checkbox, an icon
  # tile, a row number, a status mark, ⋮ — centre on the row, as
  # `MxListRow`, `MxOptionRow` and `MxSettingsRow` already do (owner
  # 2026-09-26, extending spec 2026-09-26 D4). Hand-rolled rows had pinned
  # them to the top with `CrossAxisAlignment.start`, and one checkbox was
  # patched back to the centre with `IntrinsicHeight` + `Align` while its
  # neighbours stayed pinned. The pattern stops at `children:`, so a nested
  # Column's alignment never matches.
  #
  # Excluded by file, each with its reason — a row whose children are not
  # leading/trailing marks:
  - id: memox_v8.design_system.row_marks_centre_on_the_row
    type: regex
    severity: error
    enabled: true
    mode: file
    message: >-
      A row centres its leading and trailing marks (dot, checkbox, icon,
      number, status mark, ⋮) on the row: drop `crossAxisAlignment:
      CrossAxisAlignment.start` (owner 2026-09-26). A row that is not a
      leading/trailing layout goes on this rule's `exclude:` with its reason.
    scopes:
      - dart_lib
    exclude:
      # Prose callouts: the glyph sits on the first line of a paragraph,
      # and a banner's actions sit under its text (kit Note, InlineBanner).
      - lib/shared/widgets/mx_note.dart
      - lib/shared/widgets/mx_inline_banner.dart
      - lib/shared/widgets/mx_field_message.dart
      # A field's supporting row: the message or supporting text and its
      # counter both start at the top of the row, on the first line of a
      # message that wraps.
      - lib/shared/widgets/mx_text_field.dart
      # A two-column grid of facts: each cell starts at the top of its line.
      - lib/features/card/presentation/widgets/sections/card_schedule_widget.dart
      # Three stat tiles side by side: their tops align, not their centres.
      - lib/features/study/presentation/widgets/sections/session_summary_hero_widget.dart
      # Three theme cards side by side (screen 25): their tops align.
      - lib/features/settings/presentation/screens/theme_screen.dart
      # Two columns of cards (MxTwoColumns): each column starts at the top,
      # since the columns hold different content of different heights.
      - lib/shared/widgets/mx_two_columns.dart
    patterns:
      - '\bRow\((?:(?!\bchildren:)[\s\S]){0,240}?\bcrossAxisAlignment:\s*CrossAxisAlignment\.start\b'
    tags:
      - memox-v8
      - design-system

  - id: memox_v8.design_system.tint_reads_its_base
    type: regex
    severity: error
    enabled: true
    mode: file
    message: >-
      A tint is laid over the surface directly beneath it (DESIGN.md Tint
      Rule): `role.tintOver(MxTintBase.of(context))`. A fixed base such as
      `colors.surface` paints a tint inside a card, a sheet or a dialog over
      the wrong ground. MxCard, MxBottomSheet and MxDialog set the base for
      what they hold; a new surface that holds tints wraps its child in
      `MxTintBase`.
    scopes:
      - dart_lib
    exclude:
      # The extension itself.
      - lib/core/theme/color_tint.dart
    patterns:
      - '^(?!\s*(?://|\*)).*\.tintOver\((?!\s*MxTintBase\.of\(context\),?\s*\))'
    tags:
      - memox-v8
      - design-system
