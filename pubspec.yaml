name: memox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  characters: ^1.4.1
  csv: ^8.0.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: any
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  sqlite3: ^3.6.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Shipped for the licence page (font_license.dart), as the OFL requires.
    - assets/fonts/OFL.txt
  fonts:
    # Variable font (wght axis). Weights are set through
    # AppTypography.withWeight, which moves the axis with fontWeight.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
