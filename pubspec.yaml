name: memox
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  android_alarm_manager_plus: ^5.1.1
  characters: ^1.4.1
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  csv: ^8.0.0
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  http: ^1.6.0
  intl: any
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.1
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  sqlite3: ^3.6.0
  supabase_flutter: 2.17.2
  unorm_dart: ^0.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  fake_async: ^1.3.3
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9
  retrofit_generator: ^10.2.11
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Shipped for the licence page (font_license.dart), as the OFL requires.
    - assets/fonts/OFL.txt
    # The starter templates (starter decks spec §5); Flutter reads a folder's
    # files, not its subfolders, so each folder is listed.
    - assets/templates/
    - assets/templates/en/
  fonts:
    # Variable font (wght axis). Weights are set through
    # AppTypography.withWeight, which moves the axis with fontWeight.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
