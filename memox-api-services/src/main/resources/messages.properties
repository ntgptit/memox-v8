# Client-facing API error messages, keyed by error.<ErrorCode name>.
# Bean Validation messages can be overridden here too, for example NotBlank.createDeckRequest.name=...
error.BAD_REQUEST=The request is malformed or has invalid parameters.
error.FORBIDDEN=You do not have permission to perform this action.
error.NOT_FOUND=The requested resource was not found.
error.METHOD_NOT_ALLOWED=This HTTP method is not supported for this resource.
error.NOT_ACCEPTABLE=The requested response format is not supported.
error.CONFLICT=The request conflicts with the current state of the resource.
error.PAYLOAD_TOO_LARGE=The request body is too large.
error.UNSUPPORTED_MEDIA_TYPE=The request content type is not supported.
error.INTERNAL_ERROR=An unexpected error occurred. Please try again later.
error.SERVICE_UNAVAILABLE=The service is temporarily unavailable. Please try again later.
error.VALIDATION_FAILED=One or more fields are invalid.
error.DECK_TREE_CYCLE=A deck cannot be moved inside itself or one of its sub-decks.
error.DECK_TREE_TOO_DEEP=Decks can be nested at most 10 levels deep.
error.DECK_PARENT_MISSING=The parent deck does not exist or was deleted.
error.SYNC_ENTITY_CONFLICT=This item belongs to another account.
