spring:
  application:
    name: memox-api-services
  autoconfigure:
    # No generated user and password: SecurityConfig is open until the auth spec.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.memox.common.type_handler
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  pattern:
    # Boot's default console and file patterns include this slot; see RequestIdFilter.
    correlation: "[%X{requestId:-}] "

springdoc:
  # Production sets API_DOCS_ENABLED=false.
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

memox:
  # The owner of every row until the auth spec (ADR-013).
  dev-user-id: ${MEMOX_DEV_USER_ID:00000000-0000-0000-0000-000000000001}
